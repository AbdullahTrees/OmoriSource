<body style="background:#204060;color:white;font:24px sans-serif">
<h1>NW.js probe</h1><pre id="o"></pre>
<script>
function tryGL(kind) {
  var c = document.createElement('canvas'), why = null;
  c.addEventListener('webglcontextcreationerror', function (e) { why = e.statusMessage || 'no message'; });
  var gl = c.getContext(kind);
  if (!gl) return 'NONE: ' + why;
  var d = gl.getExtension('WEBGL_debug_renderer_info');
  return d ? gl.getParameter(d.UNMASKED_RENDERER_WEBGL) + ' | ' + gl.getParameter(d.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.RENDERER);
}
setTimeout(function () {
  var info = { versions: process.versions, webgl: tryGL('webgl'), webgl2: tryGL('webgl2'), memory: process.memoryUsage() };
  document.getElementById('o').textContent = 'WebGL: ' + info.webgl + '\nWebGL2: ' + info.webgl2;
  require('fs').writeFileSync('/root/omori-test/probe.json', JSON.stringify(info, null, 1));
  setTimeout(function () { nw.App.quit(); }, 5000);
}, 5000);
</script>
